<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172554"><meta name="description" content="MyMeo — quản lý công việc, lịch và nhân sự">
  <link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
  <title>MyMeo — Quản lý công việc cá nhân</title>
</head>
<body>
<div id="authView" class="auth-wrap">
  <div class="auth-card">
    <div class="brand-mark">M</div><p class="eyebrow">PERSONAL MANAGEMENT SYSTEM</p>
    <h1>MyMeo</h1><p class="muted">Quản lý công việc, lịch làm việc, nhân sự và vật tư trong một nơi.</p>
    <div class="tabs"><button class="tab active" data-auth="login">Đăng nhập</button><button class="tab" data-auth="signup">Tạo tài khoản</button></div>
    <form id="authForm">
      <label>Email<input id="email" type="email" required placeholder="ban@email.com" autocomplete="email"></label>
      <label>Mật khẩu<input id="password" type="password" required minlength="6" placeholder="Tối thiểu 6 ký tự" autocomplete="current-password"></label>
      <button class="btn primary wide" id="authSubmit">Đăng nhập</button>
    </form>
    <p class="hint" id="authHint">Đang kiểm tra cấu hình kết nối…</p><p class="error" id="authError"></p>
  </div>
</div>
<div id="appView" class="app hidden">
  <div id="sidebarBackdrop" class="sidebar-backdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark small">M</div><div class="brand-copy"><b>MyMeo</b><small>PERSONAL MANAGER</small></div><button id="sidebarCollapseBtn" class="sidebar-collapse" aria-label="Thu gọn menu" title="Thu gọn menu">‹</button><button id="sidebarCloseBtn" class="sidebar-close" aria-label="Đóng menu">×</button></div>
    <div class="workspace-label">KHÔNG GIAN LÀM VIỆC</div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span><span class="nav-label">Tổng quan</span></button>
      <button class="nav-item" data-page="shifts"><span class="nav-icon">▣</span><span class="nav-label">Công việc & lịch</span></button>
      <button class="nav-item" data-page="employees"><span class="nav-icon">♙</span><span class="nav-label">Nhân sự</span></button>
      <button class="nav-item" data-page="materials"><span class="nav-icon">▤</span><span class="nav-label">Vật tư</span></button>
      <button class="nav-item" data-page="movements"><span class="nav-icon">⇄</span><span class="nav-label">Nhập / xuất kho</span></button>
      <button class="nav-item" data-page="reports"><span class="nav-icon">▥</span><span class="nav-label">Báo cáo</span></button>
      <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span><span class="nav-label">Cài đặt & sao lưu</span></button>
    </nav>
    <div class="sidebar-bottom"><div class="connection"><span class="online-dot"></span><span id="connectionLabel">Chưa kết nối</span></div><button id="logoutBtn" class="logout">↗ <span>Đăng xuất</span></button></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="topbar-left"><button id="menuBtn" class="icon-btn mobile-only" aria-label="Mở menu">☰</button><div><p class="eyebrow" id="crumb">MYMEO / TỔNG QUAN</p><h2 id="pageTitle">Tổng quan</h2></div></div><div class="topbar-actions"><div class="notification-wrap"><button id="notificationBtn" class="icon-btn notification-btn" aria-label="Thông báo" title="Thông báo">♧<span id="notificationBadge" class="notification-badge hidden">0</span></button><div id="notificationPanel" class="notification-panel hidden"></div></div><div class="user-chip"><div class="avatar">U</div><div><b id="userEmail">Tài khoản</b><small>Cá nhân</small></div></div></div></header>
    <section id="pageContent" class="content"></section>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><div class="modal-head"><h3 id="modalTitle">Thêm mới</h3><button id="modalClose" class="icon-btn" aria-label="Đóng">×</button></div><form id="dataForm"><div id="formFields" class="form-grid"></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">Hủy</button><button class="btn primary" type="submit">Lưu thông tin</button></div></form></div></div>
<div id="toast" class="toast" role="status"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
</body></html>
